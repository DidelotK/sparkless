name: Manual Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v4.2.1)"
        required: true
        type: string

permissions:
  contents: read

env:
  AZURE_DEVOPS_ORG: solya-azure-devops
  AZURE_DEVOPS_PROJECT: sparkless
  AZURE_DEVOPS_FEED: sparkless

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]" build twine

      - name: Build package
        run: python -m build

      - name: Publish to Azure Artifacts
        env:
          AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${AZURE_DEVOPS_PAT}" ]; then
            echo "::error::AZURE_DEVOPS_PAT is unset; refusing an unauthenticated publish." >&2
            exit 1
          fi
          # --skip-existing tolerates ONLY "already on the feed"; every other
          # failure is fatal. The previous `|| echo "Warning: ..."` swallowed
          # auth and network errors and reported success.
          twine upload \
            --non-interactive \
            --skip-existing \
            --repository-url "https://pkgs.dev.azure.com/${AZURE_DEVOPS_ORG}/${AZURE_DEVOPS_PROJECT}/_packaging/${AZURE_DEVOPS_FEED}/pypi/upload/" \
            --username _ \
            --password "${AZURE_DEVOPS_PAT}" \
            dist/*
