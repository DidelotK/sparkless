name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff format check
        run: python -m ruff format --check .
      - name: Ruff lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy sparkless tests
      # package.json (what Changesets bumps), pyproject.toml (what the wheel is
      # built from) and sparkless/_version.py must never drift apart. Catching it
      # here means it can't be discovered from a mislabelled published artifact.
      - name: Version files agree
        run: python3 scripts/release/check_version_consistency.py
      # Every pytest path named in this workflow must hold collectible tests.
      # test-compatibility pointed at tests/compatibility/ for eight months after
      # that directory was archived: it collected nothing and stayed green.
      - name: CI test paths collect tests
        run: python3 scripts/ci/check_ci_test_paths.py

  test-unit:
    runs-on: ubuntu-latest
    needs: lint-and-type
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run unit tests (parallel)
        env:
          TZ: "America/New_York"
        run: python3 -m pytest tests/unit/ -v -n 8 --dist loadfile --tb=short --cov=sparkless --cov-report=xml --cov-report=term-missing --cov-report=html
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-unit
          path: |
            coverage.xml
            htmlcov
          if-no-files-found: ignore
          # Nothing downloads these — they exist for a human to open after a
          # run. At the 90-day default they held 542 MB of the org's SHARED
          # storage (270 artifacts, every one from 2026-07-21/22) while
          # `Failed to CreateArtifact: Artifact storage quota has been hit`
          # was failing live CI in solya-data-platform. The quota is org-wide,
          # so this repo's default spends another repo's budget. One day is
          # longer than anyone waits to open a coverage report.
          retention-days: 1

  test-parity:
    runs-on: ubuntu-latest
    needs: lint-and-type
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run parity tests (PySpark parity validation)
        env:
          TZ: "America/New_York"
        run: python3 -m pytest tests/parity/ -v -n 8 --dist loadfile --tb=short --cov=sparkless --cov-report=xml --cov-report=term-missing --cov-report=html
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-parity
          path: |
            coverage.xml
            htmlcov
          if-no-files-found: ignore
          retention-days: 1  # see coverage-unit above

  # There is no test-compatibility job. tests/compatibility/ was moved to
  # tests/archive/compatibility/ by d608d2e (2025-12-14), which migrated its
  # subject matter to tests/parity/ -- covered by test-parity above. The job that
  # named the old path survived the move, collected zero tests on every run, and
  # was written to swallow pytest's exit code 5 ("no tests collected"), so it
  # reported success for eight months while verifying nothing.
  # tests/compatibility_matrix/ is not a substitute: it is a Docker-based
  # multi-version orchestrator (run_matrix_tests.py) with no test_*.py files, so
  # pointing pytest at it would reproduce the same empty-but-green job.

  # There is no test-performance job either, for the same reason. Not one test in
  # tests/ carries @pytest.mark.performance, so `-m performance` selected 0 of
  # 1329 tests and the job passed only through the same exit-code-5 tolerance.
  # test-unit's `-m "not performance"` filter was removed with it: keeping the
  # filter without a job to run the marker would silently exclude the first
  # performance test anyone writes from every job in CI.
  # tests/unit/test_performance_simulation.py is unmarked and runs in test-unit.

  test-documentation:
    runs-on: ubuntu-latest
    needs: lint-and-type
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run documentation tests (parallel)
        env:
          TZ: "America/New_York"
        run: python3 -m pytest tests/documentation/ -v -n 8 --dist loadfile --tb=short --cov=sparkless --cov-report=xml --cov-report=term-missing --cov-report=html
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-documentation
          path: |
            coverage.xml
            htmlcov
          if-no-files-found: ignore
          retention-days: 1  # see coverage-unit above

